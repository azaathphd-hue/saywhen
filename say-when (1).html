<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Say When</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#0B111B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Say When" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#0B111B;
  --panel:#141C2C;
  --panel-2:#1B2740;
  --hairline:#2A3652;
  --amber:#F5A623;
  --amber-dim:#8a641c;
  --teal:#4FD1C5;
  --red:#FF5A5A;
  --text:#EDEFF4;
  --muted:#8993A8;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sans: 'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 800px 500px at 50% -10%, #1a2540 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  padding:28px 16px 60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:460px;margin:0 auto;}

/* header */
.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;}
.brand-name{font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:0.18em;color:var(--text);}
.brand-name span{color:var(--amber);}
.brand-tag{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;}

/* console */
.console{
  background:linear-gradient(180deg,var(--panel-2),var(--panel));
  border:1px solid var(--hairline);
  border-radius:20px;
  padding:26px 22px 22px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.03);
  position:relative;
  overflow:hidden;
}
.console::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
}
.dots{position:absolute;top:14px;right:16px;display:flex;gap:5px;}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--hairline);display:block;}

.clock-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.clock{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:0.02em;color:var(--text);}
.clock .secs{color:var(--muted);font-size:18px;}
.badge{
  font-family:var(--mono);font-size:10px;letter-spacing:0.08em;padding:5px 9px;border-radius:20px;
  border:1px solid var(--hairline);color:var(--muted);white-space:nowrap;
}
.badge.live{color:var(--teal);border-color:#274a47;background:rgba(79,209,197,0.08);}
.badge.armed{color:var(--amber);border-color:#4a3a1a;background:rgba(245,166,35,0.08);}

.stage{
  min-height:200px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:14px;padding:10px 4px 6px;
}
.prompt-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase;}
.prompt{font-size:20px;font-weight:700;line-height:1.35;max-width:340px;}
.sub{font-size:13px;color:var(--muted);max-width:300px;line-height:1.5;}

/* ring button */
.ring-btn{
  width:118px;height:118px;border-radius:50%;
  border:none;cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:0.08em;
  color:#1a1206;
  background:radial-gradient(circle at 35% 30%, #ffd27a, var(--amber) 70%);
  box-shadow:0 0 0 6px rgba(245,166,35,0.12), 0 12px 30px -10px rgba(245,166,35,0.55);
  transition:transform .12s ease;
}
.ring-btn:active{transform:scale(0.96);}
.ring-btn.pulsing{animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 6px rgba(245,166,35,0.16), 0 12px 30px -10px rgba(245,166,35,0.6);}
  50%{box-shadow:0 0 0 16px rgba(245,166,35,0.06), 0 12px 40px -6px rgba(245,166,35,0.8);}
}
.mic-btn{
  width:88px;height:88px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%, #7ff0e6, var(--teal) 75%);
  box-shadow:0 0 0 6px rgba(79,209,197,0.12), 0 12px 30px -10px rgba(79,209,197,0.55);
  transition:transform .12s ease;
}
.mic-btn:active{transform:scale(0.96);}
.mic-btn.recording{animation:pulseTeal 0.9s ease-in-out infinite;}
@keyframes pulseTeal{
  0%,100%{box-shadow:0 0 0 6px rgba(79,209,197,0.18), 0 12px 30px -10px rgba(79,209,197,0.65);}
  50%{box-shadow:0 0 0 16px rgba(79,209,197,0.06), 0 12px 40px -6px rgba(79,209,197,0.85);}
}
.mic-btn svg,.ring-btn svg{width:28px;height:28px;}

/* waveform */
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:28px;margin-top:2px;}
.wave i{width:3px;border-radius:2px;background:var(--teal);opacity:0.85;height:6px;transition:height .1s ease;}

/* transcript box */
.transcript-box{
  width:100%;background:#0E1622;border:1px solid var(--hairline);border-radius:12px;
  padding:12px 14px;margin-top:6px;
}
.transcript-box textarea{
  width:100%;background:transparent;border:none;color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;resize:vertical;min-height:54px;outline:none;
}
.transcript-box .ph{color:var(--muted);}

/* buttons row */
.actions{display:flex;gap:10px;width:100%;margin-top:16px;}
.btn{
  flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--hairline);
  background:var(--panel-2);color:var(--text);font-family:var(--sans);font-weight:600;font-size:13px;
  cursor:pointer;transition:background .15s ease,border-color .15s ease;
}
.btn:hover{background:#22304c;}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1206;}
.btn.primary:hover{background:#ffb840;}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#062522;}
.btn.teal:hover{background:#6be0d5;}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--red);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* setup form */
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
.field input[type=time]{
  width:100%;background:#0E1622;border:1px solid var(--hairline);border-radius:10px;color:var(--text);
  padding:11px 12px;font-family:var(--mono);font-size:16px;
}
.quicktest{display:flex;gap:8px;margin-top:4px;}
.chip{
  font-family:var(--mono);font-size:11px;padding:7px 10px;border-radius:20px;border:1px solid var(--hairline);
  color:var(--muted);cursor:pointer;background:transparent;
}
.chip:hover{border-color:var(--teal);color:var(--teal);}

/* idle dashboard */
.taskcard{background:#0E1622;border:1px solid var(--hairline);border-radius:12px;padding:14px 16px;margin-top:6px;width:100%;}
.taskcard .k{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}
.taskcard .v{font-size:14px;font-weight:600;margin-bottom:10px;}
.taskcard .v:last-child{margin-bottom:0;}
.countdown{font-family:var(--mono);color:var(--amber);}

/* history */
.history{margin-top:22px;}
.history h3{font-family:var(--mono);font-size:11px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin:0 0 12px 2px;}
.log-entry{
  display:flex;gap:12px;padding:12px 4px;border-top:1px solid var(--hairline);
}
.log-entry:first-child{border-top:none;}
.log-id{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:2px;min-width:54px;}
.log-body{flex:1;min-width:0;}
.log-task{font-size:13.5px;font-weight:600;margin-bottom:4px;}
.log-meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;}
.status-pill{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:20px;letter-spacing:0.04em;}
.status-pill.done{background:rgba(79,209,197,0.12);color:var(--teal);}
.status-pill.progress{background:rgba(245,166,35,0.12);color:var(--amber);}
.status-pill.delayed{background:rgba(255,90,90,0.12);color:var(--red);}
.empty{color:var(--muted);font-size:13px;padding:16px 4px;}

.warn{
  background:rgba(255,90,90,0.08);border:1px solid #4a2222;color:#ff9a9a;
  font-size:12px;padding:10px 12px;border-radius:10px;margin-bottom:16px;line-height:1.5;
}
.footnote{text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:18px;letter-spacing:0.04em;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-name">SAY<span>WHEN</span></div>
    <button class="chip" id="installBtn" style="display:none;">Install app</button>
  </div>

  <div id="warnBox"></div>

  <div class="console">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="clock-row">
      <div class="clock" id="clockNow">--:--<span class="secs">:--</span></div>
      <div class="badge" id="statusBadge">IDLE</div>
    </div>
    <div class="stage" id="stage"></div>
  </div>

  <div class="history">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h3 id="historyTitle">Day Log</h3>
      <button class="chip" id="exportBtn" style="margin-bottom:12px;">Export to Excel</button>
    </div>
    <div id="logList"></div>
  </div>

  <div class="footnote">Runs on your device's mic — built-in, Bluetooth or Wi‑Fi input all work the same way.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------------- PWA install + service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if unavailable e.g. served over file:// */ });
  });
}
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  btn.style.display = 'inline-block';
  btn.onclick = async ()=>{
    btn.style.display = 'none';
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  };
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBtn').style.display = 'none';
});

/* ---------------- storage helpers ---------------- */
const STORE_KEY = 'saywhen:state';
let appState = { askTime: '08:00', entries: [], currentEntry: null, nextAlarm: null };

async function loadState(){
  try{
    if(window.storage){
      const r = await window.storage.get(STORE_KEY);
      if(r && r.value) appState = JSON.parse(r.value);
      return;
    }
  }catch(e){ /* no saved state yet in Claude preview mode */ }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) appState = JSON.parse(raw);
  }catch(e){ /* no saved state yet, or storage unavailable */ }
}
async function saveState(){
  try{
    if(window.storage){ await window.storage.set(STORE_KEY, JSON.stringify(appState)); return; }
  }catch(e){ console.error('save failed (Claude storage)', e); }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(appState)); }catch(e){ console.error('save failed (localStorage)', e); }
}

/* ---------------- speech output (text-to-speech) ---------------- */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1;
    u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){ /* ignore if TTS unavailable */ }
}

/* ---------------- speech recognition ---------------- */
let recognizer = null;
let recognizing = false;
let liveTranscript = '';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function speechSupported(){ return !!SR; }

function startRecognition(onInterim){
  if(!SR) return false;
  recognizer = new SR();
  recognizer.continuous = true;
  recognizer.interimResults = true;
  recognizer.lang = 'en-US';
  liveTranscript = '';
  recognizer.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) liveTranscript += t + ' ';
      else interim += t;
    }
    onInterim(liveTranscript.trim() + (interim ? (' ' + interim) : ''));
  };
  recognizer.onerror = ()=>{};
  recognizer.onend = ()=>{ if(recognizing){ try{ recognizer.start(); }catch(e){} } };
  try{ recognizer.start(); recognizing = true; return true; }catch(e){ return false; }
}
function stopRecognition(){
  recognizing = false;
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
}

/* ---------------- alarm sound ---------------- */
let audioCtx = null;
let alarmInterval = null;
function beep(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.value = 880;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.exponentialRampToValueAtTime(0.15, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now+0.28);
  o.start(now); o.stop(now+0.3);
}
function startAlarmSound(){
  stopAlarmSound();
  beep();
  alarmInterval = setInterval(beep, 500);
  document.title = '⏰ SAY WHEN — alarm ringing';
}
function stopAlarmSound(){
  if(alarmInterval){ clearInterval(alarmInterval); alarmInterval = null; }
  document.title = 'Say When';
}

/* ---------------- time helpers ---------------- */
function pad(n){ return n.toString().padStart(2,'0'); }
function fmtClock(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtHM(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtFull(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + fmtHM(d); }

function nextOccurrence(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
  if(t.getTime() <= now.getTime()) t.setDate(t.getDate()+1);
  return t;
}
// crude spoken-time parser -> best-effort guess, always confirmed by the time picker
function guessTimeFromSpeech(text){
  if(!text) return null;
  text = text.toLowerCase();
  let m = text.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(!m) return null;
  let h = parseInt(m[1],10), min = m[2]?parseInt(m[2],10):0;
  const ap = m[3];
  if(ap === 'pm' && h < 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  if(!ap && h < 8) h += 12; // heuristic: bare small hours likely PM for "finish" times
  if(h>23||min>59) return null;
  return pad(h)+':'+pad(min);
}

/* ---------------- excel export ---------------- */
function checkinSummary(checkins){
  return (checkins||[]).map(c=>{
    const t = new Date(c.time).toLocaleTimeString();
    return t + ': ' + c.response + (c.note ? (' — ' + c.note) : '');
  }).join('  |  ');
}
function entryToRow(e, statusOverride){
  return {
    'ID': e.id,
    'Date': e.date,
    'Task': e.task,
    'Asked At': e.askedAt ? new Date(e.askedAt).toLocaleString() : '',
    'Planned Finish': e.plannedFinish ? new Date(e.plannedFinish).toLocaleString() : '',
    'Actual Finish': e.actualFinish ? new Date(e.actualFinish).toLocaleString() : '',
    'Status': statusOverride || e.status,
    'Delays': (e.checkins||[]).filter(c=>c.response==='no').length,
    'Check-in Log': checkinSummary(e.checkins)
  };
}
function qaRowsForEntry(e){
  return (e.qa||[]).map(item=>({
    'Date': e.date,
    'Task ID': e.id,
    'Time': new Date(item.time).toLocaleString(),
    'Question': item.question,
    'Answer': item.answer
  }));
}
function exportToExcel(){
  if(typeof XLSX === 'undefined'){ alert('Excel export library failed to load — check your connection and try again.'); return; }
  const rows = [];
  const qaRows = [];
  if(appState.currentEntry){ rows.push(entryToRow(appState.currentEntry, 'in progress')); qaRows.push(...qaRowsForEntry(appState.currentEntry)); }
  appState.entries.forEach(e=>{ rows.push(entryToRow(e)); qaRows.push(...qaRowsForEntry(e)); });
  if(rows.length === 0){ alert('Nothing logged yet — complete a check-in first.'); return; }
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rows);
  ws1['!cols'] = [{wch:6},{wch:12},{wch:30},{wch:20},{wch:20},{wch:20},{wch:14},{wch:8},{wch:50}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Day Log');
  const ws2 = XLSX.utils.json_to_sheet(qaRows.sort((a,b)=> new Date(a.Time)-new Date(b.Time)));
  ws2['!cols'] = [{wch:12},{wch:8},{wch:20},{wch:32},{wch:45}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Q&A Activity');
  XLSX.writeFile(wb, 'say-when-log.xlsx');
}
document.getElementById('exportBtn').addEventListener('click', exportToExcel);

/* ---------------- app phase machine ---------------- */
// phases: setup, idle-ask, alarm-ask, ask-task, ask-finish,
//         idle-checkin, alarm-checkin, ask-checkin, ask-new-finish, done-today
let phase = 'setup';
let draftTranscript = '';
let draftTimeGuess = '';

function todayKey(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

function computeInitialPhase(){
  if(appState.currentEntry){
    const ce = appState.currentEntry;
    if(ce.status === 'awaiting-finish-checkin'){
      phase = 'idle-checkin';
    } else {
      phase = 'idle-ask';
    }
  } else {
    phase = appState.askTime ? 'idle-ask' : 'setup';
  }
}

/* ---------------- rendering ---------------- */
const stage = document.getElementById('stage');
const badge = document.getElementById('statusBadge');
const logList = document.getElementById('logList');
const warnBox = document.getElementById('warnBox');

if(!speechSupported()){
  warnBox.innerHTML = '<div class="warn">Speech recognition isn\'t available in this browser. Use Chrome or Edge for voice capture — a text box is provided as a fallback everywhere you\'d otherwise speak.</div>';
}

function setBadge(text, cls){
  badge.textContent = text;
  badge.className = 'badge' + (cls?(' '+cls):'');
}

function micIcon(){ return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="#062522" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#062522" stroke-width="1.8" stroke-linecap="round"/></svg>'; }
function stopIcon(){ return '<svg viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="#1a1206"/></svg>'; }
function alarmIcon(){ return '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="7" stroke="#1a1206" stroke-width="1.8"/><path d="M12 9v4l3 2" stroke="#1a1206" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4L2 7M19 4l3 3" stroke="#1a1206" stroke-width="1.8" stroke-linecap="round"/></svg>'; }

function waveHTML(){
  let bars = '';
  for(let i=0;i<18;i++) bars += '<i></i>';
  return '<div class="wave" id="wave">'+bars+'</div>';
}
let waveTimer = null;
function animateWave(active){
  const el = document.getElementById('wave');
  if(!el) return;
  if(waveTimer) clearInterval(waveTimer);
  if(!active){ el.querySelectorAll('i').forEach(b=>b.style.height='6px'); return; }
  waveTimer = setInterval(()=>{
    el.querySelectorAll('i').forEach(b=>{ b.style.height = (4 + Math.random()*24) + 'px'; });
  }, 120);
}

function render(){
  document.getElementById('logList').parentElement.style.display = (phase==='setup') ? 'block' : 'block';

  if(phase === 'setup'){
    setBadge('SETUP');
    stage.innerHTML = `
      <div class="prompt-eyebrow">Daily check-in time</div>
      <div class="prompt">When should Say When ask about today's task?</div>
      <div class="field" style="width:100%;margin-top:6px;">
        <label>Ask alarm</label>
        <input type="time" id="askTimeInput" value="${appState.askTime}"/>
      </div>
      <div class="actions">
        <button class="btn primary" id="saveSetup">Arm daily alarm</button>
      </div>
      <div class="quicktest">
        <button class="chip" id="test10">Test in 10s</button>
        <button class="chip" id="test60">Test in 60s</button>
      </div>
    `;
    document.getElementById('saveSetup').onclick = async ()=>{
      appState.askTime = document.getElementById('askTimeInput').value || appState.askTime;
      appState.nextAlarm = { type:'ask', at: nextOccurrence(appState.askTime).getTime() };
      await saveState();
      phase = 'idle-ask';
      render();
    };
    document.getElementById('test10').onclick = ()=>armQuickTest(10);
    document.getElementById('test60').onclick = ()=>armQuickTest(60);
    return;
  }

  if(phase === 'idle-ask'){
    setBadge('ARMED', 'armed');
    const at = appState.nextAlarm ? new Date(appState.nextAlarm.at) : null;
    stage.innerHTML = `
      <div class="prompt-eyebrow">Standing by</div>
      <div class="prompt">Next check-in ${at?('at <span class="countdown">'+fmtFull(at)+'</span>'):'not set'}</div>
      <div class="sub">The alarm will ring, and stopping it asks what you're working on today.</div>
      <div class="taskcard">
        <div class="k">Daily ask time</div>
        <div class="v">${appState.askTime}</div>
        <div class="k">Days logged</div>
        <div class="v">${appState.entries.length}</div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="reconfig">Change alarm time</button>
        <button class="btn ghost" id="ringNow">Ring now</button>
      </div>
    `;
    document.getElementById('reconfig').onclick = ()=>{ phase='setup'; render(); };
    document.getElementById('ringNow').onclick = ()=>armQuickTest(1);
    return;
  }

  if(phase === 'alarm-ask' || phase === 'alarm-checkin'){
    setBadge('RINGING', 'live');
    stage.innerHTML = `
      <div class="prompt-eyebrow">Alarm</div>
      <div class="prompt">${phase==='alarm-ask' ? 'Time to log today\'s task' : 'Check-in time'}</div>
      <button class="ring-btn pulsing" id="stopAlarmBtn">${alarmIcon()}STOP</button>
    `;
    document.getElementById('stopAlarmBtn').onclick = ()=>{
      stopAlarmSound();
      const goingTo = (phase==='alarm-ask') ? 'ask-task' : 'ask-checkin';
      phase = goingTo;
      draftTranscript = '';
      render();
      speak(goingTo==='ask-task' ? 'What is your task today?' : "Have you finished today's task?");
    };
    return;
  }

  if(phase === 'ask-task' || phase === 'ask-finish' || phase === 'ask-new-finish'){
    setBadge('LISTENING', 'live');
    const isTask = phase === 'ask-task';
    const promptText = isTask ? 'What is your task today?' : 'By when will you finish?';
    stage.innerHTML = `
      <div class="prompt-eyebrow">${isTask?'Task':'Target time'}</div>
      <div class="prompt">${promptText}</div>
      <button class="mic-btn" id="micBtn">${micIcon()}</button>
      ${waveHTML()}
      <div class="transcript-box">
        <textarea id="transcriptArea" placeholder="Tap the mic and speak — or type here instead">${draftTranscript}</textarea>
      </div>
      ${!isTask ? `<div class="field" style="width:100%;">
        <label>Confirm target time</label>
        <input type="time" id="finishTimeInput" value="${draftTimeGuess||''}"/>
      </div>` : ''}
      <div class="actions">
        <button class="btn primary" id="saveAnswer">${isTask?'Save task':'Set alarm'}</button>
      </div>
    `;
    const micBtn = document.getElementById('micBtn');
    const ta = document.getElementById('transcriptArea');
    let isRec = false;
    micBtn.onclick = ()=>{
      if(!speechSupported()){ ta.focus(); return; }
      if(!isRec){
        isRec = true;
        micBtn.classList.add('recording');
        animateWave(true);
        startRecognition((text)=>{
          ta.value = text;
          draftTranscript = text;
          if(!isTask){
            const g = guessTimeFromSpeech(text);
            if(g){ draftTimeGuess = g; const fi=document.getElementById('finishTimeInput'); if(fi) fi.value = g; }
          }
        });
      } else {
        isRec = false;
        micBtn.classList.remove('recording');
        animateWave(false);
        stopRecognition();
      }
    };
    ta.oninput = ()=>{ draftTranscript = ta.value; };
    document.getElementById('saveAnswer').onclick = async ()=>{
      stopRecognition(); animateWave(false);
      const text = ta.value.trim();
      if(isTask){
        appState.currentEntry = {
          id: 'T'+(appState.entries.length+1),
          date: todayKey(),
          askedAt: Date.now(),
          task: text || '(no task recorded)',
          plannedFinish: null,
          checkins: [],
          qa: [{ time: Date.now(), question: 'What is your task today?', answer: text || '(no task recorded)' }],
          status: 'in-progress'
        };
        await saveState();
        phase = 'ask-finish';
        draftTranscript = ''; draftTimeGuess='';
        render();
        speak('By when will you finish?');
      } else {
        const fi = document.getElementById('finishTimeInput');
        const chosen = fi.value || draftTimeGuess;
        if(!chosen){ fi.focus(); return; }
        const at = nextOccurrence(chosen);
        appState.currentEntry.plannedFinish = at.getTime();
        appState.currentEntry.finishSpeech = text;
        appState.currentEntry.status = 'awaiting-finish-checkin';
        appState.currentEntry.qa.push({ time: Date.now(), question: 'By when will you finish?', answer: (text || chosen) + ' (target ' + chosen + ')' });
        appState.nextAlarm = { type:'checkin', at: at.getTime() };
        await saveState();
        phase = 'idle-checkin';
        draftTranscript = ''; draftTimeGuess='';
        render();
      }
    };
    return;
  }

  if(phase === 'idle-checkin'){
    setBadge('ARMED', 'armed');
    const ce = appState.currentEntry;
    const at = appState.nextAlarm ? new Date(appState.nextAlarm.at) : null;
    stage.innerHTML = `
      <div class="prompt-eyebrow">In progress</div>
      <div class="prompt">Check-in at <span class="countdown">${at?fmtFull(at):'--'}</span></div>
      <div class="taskcard">
        <div class="k">Today's task</div>
        <div class="v">${ce.task}</div>
        <div class="k">Target finish</div>
        <div class="v">${ce.plannedFinish?fmtHM(new Date(ce.plannedFinish)):'--'}</div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="ringNow2">Ring now</button>
      </div>
    `;
    document.getElementById('ringNow2').onclick = ()=>armQuickTest(1);
    return;
  }

  if(phase === 'ask-checkin'){
    setBadge('LISTENING', 'live');
    stage.innerHTML = `
      <div class="prompt-eyebrow">Check-in</div>
      <div class="prompt">Have you finished today's task?</div>
      <button class="mic-btn" id="micBtn2">${micIcon()}</button>
      ${waveHTML()}
      <div class="transcript-box">
        <textarea id="transcriptArea2" placeholder="Say yes or no — or type here">${draftTranscript}</textarea>
      </div>
      <div class="actions">
        <button class="btn teal" id="yesBtn">Yes, finished</button>
        <button class="btn" id="noBtn">Not yet</button>
      </div>
    `;
    const micBtn = document.getElementById('micBtn2');
    const ta = document.getElementById('transcriptArea2');
    let isRec = false;
    micBtn.onclick = ()=>{
      if(!speechSupported()){ ta.focus(); return; }
      if(!isRec){
        isRec = true; micBtn.classList.add('recording'); animateWave(true);
        startRecognition((text)=>{ ta.value = text; draftTranscript = text;
          const low = text.toLowerCase();
          if(/\b(yes|yeah|yep|done|finished|complete)\b/.test(low)){ document.getElementById('yesBtn').style.outline='2px solid var(--teal)'; }
          if(/\b(no|not yet|nope|still)\b/.test(low)){ document.getElementById('noBtn').style.outline='2px solid var(--amber)'; }
        });
      } else { isRec=false; micBtn.classList.remove('recording'); animateWave(false); stopRecognition(); }
    };
    ta.oninput = ()=>{ draftTranscript = ta.value; };
    const finalizeCheckin = async (response)=>{
      stopRecognition(); animateWave(false);
      const noteText = ta.value.trim();
      appState.currentEntry.checkins.push({ time: Date.now(), response, note: noteText });
      appState.currentEntry.qa.push({ time: Date.now(), question: "Have you finished today's task?", answer: (response==='yes'?'Yes':'Not yet') + (noteText?(' — '+noteText):'') });
      if(response === 'yes'){
        appState.currentEntry.status = 'done';
        appState.currentEntry.actualFinish = Date.now();
        appState.entries.unshift(appState.currentEntry);
        appState.currentEntry = null;
        appState.nextAlarm = { type:'ask', at: nextOccurrence(appState.askTime).getTime() };
        await saveState();
        phase = 'idle-ask';
        draftTranscript='';
        render();
      } else {
        await saveState();
        phase = 'ask-new-finish';
        draftTranscript=''; draftTimeGuess='';
        render();
        speak('When will you finish?');
      }
    };
    document.getElementById('yesBtn').onclick = ()=>finalizeCheckin('yes');
    document.getElementById('noBtn').onclick = ()=>finalizeCheckin('no');
    return;
  }
}

function renderLog(){
  document.getElementById('historyTitle').textContent = 'Day Log — ' + appState.entries.length + ' logged';
  if(appState.entries.length === 0){
    logList.innerHTML = '<div class="empty">Nothing logged yet. Your first check-in will appear here.</div>';
    return;
  }
  logList.innerHTML = appState.entries.map(e=>{
    const delays = e.checkins.filter(c=>c.response==='no').length;
    const statusCls = e.status==='done' ? (delays>0?'delayed':'done') : 'progress';
    const statusText = e.status==='done' ? (delays>0? (delays+' delay'+(delays>1?'s':'')) : 'On time') : 'In progress';
    return `<div class="log-entry">
      <div class="log-id">${e.id}</div>
      <div class="log-body">
        <div class="log-task">${escapeHtml(e.task)}</div>
        <div class="log-meta">
          <span class="status-pill ${statusCls}">${statusText}</span>
          <span>asked ${fmtHM(new Date(e.askedAt))}</span>
          ${e.plannedFinish?`<span>target ${fmtHM(new Date(e.plannedFinish))}</span>`:''}
          ${e.actualFinish?`<span>done ${fmtHM(new Date(e.actualFinish))}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* quick test helper: fires the alarm N seconds from now, for trying the flow live */
function armQuickTest(seconds){
  const type = (phase==='idle-checkin') ? 'checkin' : 'ask';
  appState.nextAlarm = { type, at: Date.now() + seconds*1000 };
  saveState();
  render();
}

/* ---------------- clock + alarm ticker ---------------- */
function tickClock(){
  const now = new Date();
  document.getElementById('clockNow').innerHTML = pad(now.getHours())+':'+pad(now.getMinutes())+'<span class="secs">:'+pad(now.getSeconds())+'</span>';
}
function tickAlarmCheck(){
  if(!appState.nextAlarm) return;
  if(phase==='setup' || phase.startsWith('alarm') || phase.startsWith('ask')) return;
  if(Date.now() >= appState.nextAlarm.at){
    if(appState.nextAlarm.type === 'ask' && phase==='idle-ask'){
      phase = 'alarm-ask'; startAlarmSound(); render();
    } else if(appState.nextAlarm.type === 'checkin' && phase==='idle-checkin'){
      phase = 'alarm-checkin'; startAlarmSound(); render();
    }
  } else {
    // live-update the idle countdown display
    if(phase==='idle-ask' || phase==='idle-checkin') render();
  }
}

setInterval(()=>{ tickClock(); }, 1000);
setInterval(()=>{ tickAlarmCheck(); }, 1000);

/* ---------------- boot ---------------- */
(async function boot(){
  await loadState();
  computeInitialPhase();
  tickClock();
  render();
  renderLog();
  const origRender = render;
  render = function(){ origRender(); renderLog(); };
  render();
})();
</script>
</body>
